previews:
    generation: automatic

databases:
  - name: mapsurvey-db
    plan: basic-256mb
    databaseName: mapsurvey
    user: mapsurvey
    postgresMajorVersion: 16
    ipAllowList: []
    previewPlan: basic-256mb

services:
  - type: web
    name: mapsurvey
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mapsurvey-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: "localhost mapsurvey.org mapsurvey.render.com *.render.com"
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
        previewEnvRenderServiceName: mapsurvey
      - key: DEFAULT_FROM_EMAIL
        sync: false
        previewEnvRenderServiceName: mapsurvey
      - key: DEMO_SURVEY_URL
        sync: false
        previewEnvRenderServiceName: mapsurvey
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
        previewEnvRenderServiceName: mapsurvey
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
        previewEnvRenderServiceName: mapsurvey
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
        previewEnvRenderServiceName: mapsurvey
      - key: EMAIL_BACKEND
        sync: false
        previewEnvRenderServiceName: mapsurvey
      - key: EMAIL_HOST
        sync: false
        previewEnvRenderServiceName: mapsurvey
      - key: EMAIL_PORT
        sync: false
        previewEnvRenderServiceName: mapsurvey
      - key: EMAIL_USE_SSL
        sync: false
        previewEnvRenderServiceName: mapsurvey
      - key: EMAIL_HOST_USER
        sync: false
        previewEnvRenderServiceName: mapsurvey
      - key: EMAIL_HOST_PASSWORD
        sync: false
        previewEnvRenderServiceName: mapsurvey
    disk:
      name: media-storage
      mountPath: /home/app/web/mediafiles
      sizeGB: 1
    healthCheckPath: /
