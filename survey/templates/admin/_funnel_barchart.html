{# Inline-SVG bar chart. Expects: chart (bar_chart_geometry output), color, empty_label #}
{% load i18n %}
{% if chart.count %}
<svg viewBox="0 0 {{ chart.width }} {{ chart.height }}" width="100%" height="{{ chart.height }}"
     preserveAspectRatio="none" role="img" style="max-width:100%;">
  <line x1="{{ chart.x0 }}" y1="{{ chart.baseline }}" x2="{{ chart.x1 }}" y2="{{ chart.baseline }}"
        stroke="#ccc" stroke-width="1"/>
  <text x="{{ chart.x0 }}" y="{{ chart.max_y }}" font-size="10" fill="#999">max {{ chart.max }}</text>
  {% for b in chart.bars %}
  <rect x="{{ b.x }}" y="{{ b.y }}" width="{{ b.w }}" height="{{ b.h }}" fill="{{ color }}" rx="1">
    <title>{{ b.label }}: {{ b.value }}</title>
  </rect>
  {% if b.show_label %}
  <text x="{{ b.cx }}" y="{{ chart.label_y }}" font-size="9" fill="#999" text-anchor="middle">{{ b.label|slice:"5:" }}</text>
  {% endif %}
  {% endfor %}
</svg>
{% else %}
<p class="subtle">{{ empty_label }}</p>
{% endif %}
