{% comment %}
Reference overlay layers on the respondent map (openspec: reference-overlay-layers).

Bare JS — this partial is included INSIDE the shell's <script> block, next to
basemap_layers.html. Config arrives via the "ref-layers-data" json_script emitted
by base_survey_template.html; geometry is fetched per layer from the gated endpoint
exactly once, because layers live across HTMX section swaps on the persistent map.
Per-section visibility is applied by initSection() via applyRefLayerVisibility().
{% endcomment %}
(function() {
    var dataEl = document.getElementById('ref-layers-data');
    var layers = [];
    if (dataEl) { try { layers = JSON.parse(dataEl.textContent) || []; } catch (e) {} }
    window._refLayers = {};
    window.applyRefLayerVisibility = function() {};
    if (!layers.length) return;

    // Dedicated pane below the marker/draw panes so answer geometry always
    // draws on top of the reference material.
    map.createPane('refLayersPane');
    map.getPane('refLayersPane').style.zIndex = 350;

    if (!window._layersControl) {
        window._layersControl = L.control.layers(null, null, { position: 'topright', collapsed: true }).addTo(map);
    }

    function esc(v) {
        return String(v).replace(/[&<>"']/g, function(c) {
            return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
        });
    }

    // simplestyle-spec properties win over the layer's fallback color, so a plan
    // exported with its own colors arrives already styled.
    function featureStyle(meta, props) {
        props = props || {};
        return {
            color: props['stroke'] || meta.color,
            weight: props['stroke-width'] != null ? Number(props['stroke-width']) : 2,
            opacity: props['stroke-opacity'] != null ? Number(props['stroke-opacity']) : 0.9,
            fillColor: props['fill'] || meta.color,
            fillOpacity: props['fill-opacity'] != null ? Number(props['fill-opacity']) : 0.15,
            pane: 'refLayersPane'
        };
    }

    var _suppressEvents = false;

    layers.forEach(function(meta) {
        var entry = { meta: meta, layer: null, allowed: true, userOff: false, added: false };
        window._refLayers[meta.id] = entry;
        fetch(meta.url).then(function(r) {
            if (!r.ok) throw new Error('layer ' + meta.id + ' HTTP ' + r.status);
            return r.json();
        }).then(function(fc) {
            entry.layer = L.geoJSON(fc, {
                pane: 'refLayersPane',
                interactive: !!meta.show_popups,
                style: function(f) { return featureStyle(meta, f.properties); },
                pointToLayer: function(f, latlng) {
                    var p = f.properties || {};
                    // Circle markers, never default pins: a pin reads as an answer.
                    return L.circleMarker(latlng, {
                        pane: 'refLayersPane',
                        radius: 6,
                        color: p['marker-color'] || meta.color,
                        fillColor: p['marker-color'] || meta.color,
                        fillOpacity: 0.85,
                        interactive: !!meta.show_popups
                    });
                },
                onEachFeature: function(f, lyr) {
                    var p = f.properties || {};
                    if (meta.label_field && p[meta.label_field] != null) {
                        lyr.bindTooltip(esc(p[meta.label_field]), {
                            permanent: true, direction: 'center', className: 'ref-layer-label'
                        });
                    }
                    if (meta.show_popups) {
                        var title = p.name != null ? p.name : (meta.label_field ? p[meta.label_field] : null);
                        var body = p.description != null ? p.description : '';
                        if (title || body) {
                            lyr.bindPopup(
                                (title != null && title !== '' ? '<b>' + esc(title) + '</b>' : '') +
                                (title && body ? '<br>' : '') + (body ? esc(body) : '')
                            );
                        }
                    }
                },
            });
            if (entry.allowed && !entry.userOff) { entry.layer.addTo(map); entry.added = true; }
            if (entry.allowed) { window._layersControl.addOverlay(entry.layer, esc(meta.name)); }
        }).catch(function(err) { console.warn('Reference layer failed:', err); });
    });

    // A respondent who switches a layer off keeps it off across sections; only
    // their own toggles count, not the programmatic add/remove below.
    map.on('overlayremove', function(e) {
        if (_suppressEvents) return;
        for (var id in window._refLayers) {
            if (window._refLayers[id].layer === e.layer) {
                window._refLayers[id].userOff = true;
                window._refLayers[id].added = false;
            }
        }
    });
    map.on('overlayadd', function(e) {
        if (_suppressEvents) return;
        for (var id in window._refLayers) {
            if (window._refLayers[id].layer === e.layer) {
                window._refLayers[id].userOff = false;
                window._refLayers[id].added = true;
            }
        }
    });

    window.applyRefLayerVisibility = function(hiddenIds) {
        hiddenIds = hiddenIds || [];
        _suppressEvents = true;
        try {
            for (var id in window._refLayers) {
                var entry = window._refLayers[id];
                var allowed = hiddenIds.indexOf(entry.meta.id) === -1;
                if (allowed === entry.allowed) continue;
                entry.allowed = allowed;
                if (!entry.layer) continue;
                if (!allowed) {
                    if (entry.added) { map.removeLayer(entry.layer); entry.added = false; }
                    window._layersControl.removeLayer(entry.layer);
                } else {
                    window._layersControl.addOverlay(entry.layer, esc(entry.meta.name));
                    if (!entry.userOff) { entry.layer.addTo(map); entry.added = true; }
                }
            }
        } finally { _suppressEvents = false; }
    };
})();
