{% comment %}
Reference overlay layers on the respondent map (openspec: reference-overlay-layers).

Bare JS — this partial is included INSIDE the shell's <script> block, next to
basemap_layers.html. Config arrives via the "ref-layers-data" json_script emitted
by base_survey_template.html; geometry is fetched per layer from the gated endpoint
exactly once, because layers live across HTMX section swaps on the persistent map.
Per-section visibility is applied by initSection() via applyRefLayerVisibility(visibleIds):
a layer is on a section's map when a placement covers the section, and nowhere else
(change map-layers-study-area); it starts switched on every time a section opens.
Layer construction (styling, markers, labels, popups) lives in ref_layer_factory.html,
which must be included before this partial.
{% endcomment %}
(function() {
    var dataEl = document.getElementById('ref-layers-data');
    var layers = [];
    if (dataEl) { try { layers = JSON.parse(dataEl.textContent) || []; } catch (e) {} }
    window._refLayers = {};
    window.applyRefLayerVisibility = function() {};
    if (!layers.length) return;

    // Dedicated pane below the marker/draw panes so answer geometry always
    // draws on top of the reference material.
    map.createPane('refLayersPane');
    map.getPane('refLayersPane').style.zIndex = 350;

    if (!window._layersControl) {
        window._layersControl = L.control.layers(null, null, { position: 'topright', collapsed: true }).addTo(map);
    }

    var esc = window.RefLayerFactory.esc;

    var _suppressEvents = false;

    layers.forEach(function(meta) {
        // Nothing is allowed until the section says so — the shell loads
        // every layer of the survey once, each section names the ones it shows.
        var entry = { meta: meta, layer: null, allowed: false, userOff: false, added: false };
        window._refLayers[meta.id] = entry;
        fetch(meta.url).then(function(r) {
            if (!r.ok) throw new Error('layer ' + meta.id + ' HTTP ' + r.status);
            return r.json();
        }).then(function(fc) {
            entry.layer = window.RefLayerFactory.build(meta, fc, { pane: 'refLayersPane' });
            entry.featureCollection = fc;
            if (entry.allowed && !entry.userOff) { entry.layer.addTo(map); entry.added = true; }
            if (entry.allowed) { window._layersControl.addOverlay(entry.layer, window.RefLayerFactory.overlayLabel(meta)); }
            // A legend nobody sees is no legend: open the control once when one arrives.
            // Desktop only: on a phone the expanded control covers the map and the popups.
            if (entry.allowed && meta.legend && meta.legend.length && !window._legendShown && !(typeof isMobile === 'function' && isMobile())) { window._legendShown = true; try { window._layersControl.expand(); } catch (e) {} }
            // Objects-on-the-map blocks (layer_objects_block.html) build their
            // list from this collection once it has arrived.
            document.dispatchEvent(new CustomEvent('refLayerLoaded', { detail: { id: meta.id } }));
        }).catch(function(err) { console.warn('Reference layer failed:', err); });
    });

    // A respondent may switch a layer off on this section; every placed layer is switched on
    // again when the next section opens (spec map-layer-placement, owner 2026-11-24). Only
    // their own toggles count, not the programmatic add/remove below.
    function syncLegend(entry) {
        document.querySelectorAll('[data-otm-toggle="' + entry.meta.id + '"]').forEach(function(box) {
            box.checked = !!entry.added;
        });
    }
    map.on('overlayremove', function(e) {
        if (_suppressEvents) return;
        for (var id in window._refLayers) {
            if (window._refLayers[id].layer === e.layer) {
                window._refLayers[id].userOff = true;
                window._refLayers[id].added = false;
                syncLegend(window._refLayers[id]);
            }
        }
    });
    map.on('overlayadd', function(e) {
        if (_suppressEvents) return;
        for (var id in window._refLayers) {
            if (window._refLayers[id].layer === e.layer) {
                window._refLayers[id].userOff = false;
                window._refLayers[id].added = true;
                syncLegend(window._refLayers[id]);
            }
        }
    });
    // The panel's "On this map" toggles (survey_section_partial.html) drive the same layers.
    document.addEventListener('change', function(e) {
        var box = e.target && e.target.closest && e.target.closest('[data-otm-toggle]');
        if (!box) return;
        var entry = window._refLayers[box.getAttribute('data-otm-toggle')];
        if (!entry || !entry.layer || !entry.allowed) return;
        if (box.checked && !entry.added) { entry.layer.addTo(map); }
        else if (!box.checked && entry.added) { map.removeLayer(entry.layer); }
    });

    window.applyRefLayerVisibility = function(visibleIds) {
        visibleIds = visibleIds || [];
        _suppressEvents = true;
        try {
            for (var id in window._refLayers) {
                var entry = window._refLayers[id];
                var allowed = visibleIds.indexOf(entry.meta.id) !== -1;
                entry.userOff = false;   // a new section starts with every placed layer on
                var wasAllowed = entry.allowed;
                entry.allowed = allowed;
                if (!entry.layer) continue;
                if (!allowed) {
                    if (entry.added) { map.removeLayer(entry.layer); entry.added = false; }
                    if (wasAllowed) window._layersControl.removeLayer(entry.layer);
                } else {
                    if (!wasAllowed) window._layersControl.addOverlay(entry.layer, window.RefLayerFactory.overlayLabel(entry.meta));
                    if (!entry.added) { entry.layer.addTo(map); entry.added = true; }
                }
                syncLegend(entry);
            }
        } finally { _suppressEvents = false; }
    };
})();
