<div class="modal fade editor-modal" id="addBlockModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add block</h5>
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
            </div>
            <form method="post" action="{% url 'editor_public_results_block_add' survey.uuid %}" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="modal-body">
                    <div class="pr-field">
                        <label>Block type</label>
                        <select name="block_type" class="form-control" id="prBlockType" onchange="prToggleAddBlockFields();">
                            <option value="question">Question results…</option>
                            <option value="image">Image</option>
                            <option value="text">Text block</option>
                        </select>
                    </div>
                    <div class="pr-field" id="prQWrap">
                        <label>Question</label>
                        <select name="question_id" id="prQ" class="form-control">
                            {% for row in question_rows %}
                            <option value="{{ row.question.id }}" {% if not row.publishable %}disabled{% endif %}>
                                {{ row.question.name }}{% if not row.publishable %} (text — not publishable){% else %} — {{ row.input_type_display }} · {{ row.answer_count }} response{{ row.answer_count|pluralize }}{% endif %}
                            </option>
                            {% endfor %}
                        </select>
                        <div class="pr-help"><i class="fas fa-info-circle"></i> Text questions are not available for publication — individual answers are never shown publicly.</div>
                    </div>
                    <div class="pr-field" id="prImgWrap" style="display:none;">
                        <label>Image file</label>
                        <input type="file" name="image" id="prImg" class="form-control-file" accept="image/*">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i> Add block</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
function prToggleAddBlockFields() {
    var type = document.getElementById('prBlockType').value;
    document.getElementById('prQWrap').style.display = type === 'question' ? '' : 'none';
    document.getElementById('prImgWrap').style.display = type === 'image' ? '' : 'none';
}
</script>
