{% load i18n %}
<div class="stat-cards">
    <div class="stat-card">
        <div class="stat-value">{{ total_sessions }}</div>
        <div class="stat-label">{% trans "Total Sessions" %}</div>
    </div>
    <div class="stat-card">
        <div class="stat-value">{{ completed_count }}</div>
        <div class="stat-label">{% trans "Completed" %}</div>
    </div>
    <div class="stat-card">
        <div class="stat-value">{{ completion_rate }}%</div>
        <div class="stat-label">{% trans "Completion Rate" %}</div>
    </div>
    {% if flagged_count %}
    <div class="stat-card" style="border-color:#fd7e14;">
        <div class="stat-value" style="color:#fd7e14;">{{ flagged_count }}</div>
        <div class="stat-label">{% trans "Flagged" %}</div>
    </div>
    {% endif %}
</div>
