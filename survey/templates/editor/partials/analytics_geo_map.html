{% load i18n %}
<div class="analytics-section">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
        <h6 style="margin:0;">{% trans "Response Map" %} <small class="text-muted">({{ geo_features_count }} {% trans "features" %})</small></h6>
        <button class="expand-btn" onclick="togglePanelFullscreen('data-panel-map')"><i class="fas fa-expand"></i></button>
    </div>
    <div class="q-filter-pills" data-qid="geo" style="display:none;flex-wrap:wrap;gap:0.3rem;margin-bottom:0.4rem;"></div>
    <div id="analytics-map"></div>
</div>

{# Session detail modal moved to analytics_dashboard.html (unconditional, shared with Table tab) #}

<script>
document.addEventListener('DOMContentLoaded', function() {
    var geoData = JSON.parse('{{ geo_json|escapejs }}');
    // Reference-layer metadata (openspec: responses-reference-layers). The map
    // renders when the survey has layers even before the first geo answer, so a
    // creator can check the zones on the very map they will read answers from.
    var refLayerMetas = [];
    var refDataEl = document.getElementById('ref-layers-data');
    if (refDataEl) { try { refLayerMetas = JSON.parse(refDataEl.textContent) || []; } catch (e) {} }
    if (!geoData.features.length && !refLayerMetas.length) return;

    window.geoToolMode = 'pointer';
    window._sessionMiniMap = null;

    var mapboxUrl = '{{ MAPBOX_URL }}';
    var mapboxAccessToken = '{{ MAPBOX_ACCESS_TOKEN }}';

    var map = L.map('analytics-map', { zoomControl: false });
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    window.analyticsMap = map;

    {% include "partials/basemap_layers.html" %}

    // ── Reference layers ──────────────────────────────────────────
    // Reference layers are slots of the LayerManager (type 'reference'), so
    // the Layers panel owns them: checkbox, drag order, opacity. Each slot gets
    // its own pane, which makes the stacking order the panel order rather than
    // the order the fetches happened to complete in. Non-interactive whatever
    // the layer's popup setting: a reference polygon must never swallow a click
    // meant for an answer or for the selection tools. Every section's layers are
    // shown -- this map aggregates all sections, so hidden_layers does not apply.
    // Geometry is fetched once per page and cached for the response map modal.
    // Order, visibility and opacity are remembered per survey in this browser
    // only (openspec: responses-reference-layers, design D10).
    window._analyticsRefLayers = [];
    var _refPrefsKey = 'rv2RefLayers:{{ survey.uuid }}';
    function _loadRefPrefs() {
        try { return JSON.parse(localStorage.getItem(_refPrefsKey)) || {}; } catch (e) { return {}; }
    }
    function _saveRefPrefs() {
        var lm = window.layerManager;
        if (!lm) return;
        var prefs = { order: lm.getSlotIds(), hidden: [], opacity: {} };
        lm.getSlotIds().forEach(function(id) {
            var slot = lm.getSlot(id);
            if (!slot || slot.type !== 'reference') return;
            if (!slot.visible) prefs.hidden.push(id);
            if (slot.opacity !== 1) prefs.opacity[id] = slot.opacity;
        });
        try { localStorage.setItem(_refPrefsKey, JSON.stringify(prefs)); } catch (e) {}
    }
    window._saveRefPrefs = _saveRefPrefs;
    // Order, applied every time a layer arrives: the panel rows and the pane
    // z-indices both follow it. Saved order first; anything it does not know
    // keeps its place, except reference layers, which fall in by their
    // survey-settings position -- position 0 is the bottom row, so a boundary
    // uploaded first draws beneath the zones uploaded after it, whatever the
    // network did.
    function _refPositionIndex(id) {
        var n = parseInt(id.slice(4), 10);
        for (var i = 0; i < refLayerMetas.length; i++) if (refLayerMetas[i].id === n) return i;
        return -1;
    }
    function _applyRefOrder() {
        var lm = window.layerManager, prefs = _loadRefPrefs();
        if (!lm) return;
        var current = lm.getSlotIds();
        var isRef = function(id) { return id.indexOf('ref:') === 0; };
        var answers = current.filter(function(id) { return !isRef(id); });
        var refs = current.filter(isRef);
        var saved = (prefs.order || []).filter(function(id) { return refs.indexOf(id) !== -1; });
        var rest = refs.filter(function(id) { return saved.indexOf(id) === -1; })
            .sort(function(a, b) { return _refPositionIndex(b) - _refPositionIndex(a); });
        var refOrder = saved.concat(rest);
        // Reference layers always sit beneath every answer layer: the panel
        // keeps them in their own group, so the order is answers, then refs.
        lm.reorder(answers.concat(refOrder));
        if (_legendRefBody) {
            refOrder.forEach(function(id) {
                var el = _legendRefBody.querySelector('[data-layer-id="' + CSS.escape(id) + '"]');
                if (el) _legendRefBody.appendChild(el);
            });
        }
    }
    // Panel rows -> LayerManager order, answers first, then the reference group.
    function _syncOrderFromPanel() {
        var lm = window.layerManager;
        if (!lm) return;
        var order = [];
        [_legendBody, _legendRefBody].forEach(function(container) {
            if (!container) return;
            container.querySelectorAll('.geo-legend-item').forEach(function(el) { order.push(el.dataset.layerId); });
        });
        lm.reorder(order);
        _saveRefPrefs();
    }
    // The Map pane starts hidden (0x0 container) and only invalidateSize()s
    // when its tab opens; a layer joins the map only once the map has a size,
    // so nothing is measured against a container that does not exist yet.
    function whenMapSized(fn) {
        var size = map.getSize();
        if (size.x > 0 && size.y > 0) { fn(); return; }
        map.once('resize', fn);
    }
    // With no answers the map follows the union of the layers as they arrive,
    // until the creator moves it themselves.
    var refFitBounds = L.latLngBounds([]);
    var refFitActive = !geoData.features.length;
    var _ownMove = false;
    map.on('dragstart', function() { refFitActive = false; });
    map.on('zoomstart', function() { if (!_ownMove) refFitActive = false; });
    // Reference layers for any other map on the page -- the Overview thumbnail,
    // the response modal. Same geometry cache, same visibility, order and
    // opacity as the Layers panel: its slots when they exist, the saved prefs
    // (or survey position) before the Map pane has been opened. One pane per
    // layer so opacity applies per layer; re-rendering replaces the last set.
    window.rv2RenderRefLayers = function(target) {
        if (!window.RefLayerFactory) return;
        (target._rv2RefLayers || []).forEach(function(l) { if (target.hasLayer(l)) target.removeLayer(l); });
        target._rv2RefLayers = [];
        var lm = window.layerManager, prefs = _loadRefPrefs();
        var entries = (window._analyticsRefLayers || []).filter(function(e) { return e.fc; });
        var slotOf = function(e) { return lm ? lm.getSlot('ref:' + e.meta.id) : null; };
        var idOf = function(e) { return 'ref:' + e.meta.id; };
        var rank = function(e) {   // higher = drawn on top
            var slot = slotOf(e);
            if (slot && lm) return -lm.getSlotIds().indexOf(slot.id);
            var saved = (prefs.order || []).indexOf(idOf(e));
            if (saved !== -1) return -saved;
            return -1000 + _refPositionIndex(idOf(e));
        };
        entries.sort(function(a, b) { return rank(a) - rank(b); });
        entries.forEach(function(entry, i) {
            var slot = slotOf(entry);
            var visible = slot ? slot.visible : (prefs.hidden || []).indexOf(idOf(entry)) === -1;
            if (!visible) return;
            var opacity = slot ? slot.opacity : (typeof (prefs.opacity || {})[idOf(entry)] === 'number' ? prefs.opacity[idOf(entry)] : 1);
            var pane = 'rv2RefPane' + i;
            if (!target.getPane(pane)) target.createPane(pane);
            target.getPane(pane).style.zIndex = 350 + i;
            target.getPane(pane).style.opacity = opacity;
            // A layer bound to an Objects-on-the-map question is clickable here:
            // each object carries its answer badge, and a click selects the
            // sessions that answered about it (spec object-answers).
            var stats = entry.meta.object_stats || null;
            var layer = window.RefLayerFactory.build(entry.meta, entry.fc, { interactive: !!stats, pane: pane });
            if (stats) {
                var escFn = window.RefLayerFactory.esc;
                layer.eachLayer(function(l) {
                    var p = l.feature && l.feature.properties; if (!p || !p._key) return;
                    var s = stats[p._key];
                    var label = escFn(p._title || p._key) + (s ? ' — ' + escFn(s.headline) : '');
                    l.bindTooltip(label, { direction: 'top', className: 'rv2-object-badge' });
                    if (s && s.sessions && s.sessions.length) {
                        l.on('click', function() {
                            if (window.selectionManager) window.selectionManager.setSelection(s.sessions);
                        });
                    }
                });
            }
            layer.addTo(target);
            target._rv2RefLayers.push(layer);
        });
    };
    if (refLayerMetas.length && window.RefLayerFactory) {
        refLayerMetas.forEach(function(meta) {
            var entry = { meta: meta, fc: null, layer: null };
            window._analyticsRefLayers.push(entry);
            fetch(meta.url).then(function(r) {
                if (!r.ok) throw new Error('layer ' + meta.id + ' HTTP ' + r.status);
                return r.json();
            }).then(function(fc) {
                entry.fc = fc;
                // Other maps on the page (Overview thumbnail, response modal)
                // draw from the same cache; tell them a layer is in.
                document.dispatchEvent(new CustomEvent('analytics:reflayer', { detail: entry }));
                whenMapSized(function() {
                    var lm = window.layerManager;
                    if (!lm) return;
                    var prefs = _loadRefPrefs();
                    var slot = lm.addReference(entry, {
                        visible: !(prefs.hidden || []).some(function(h) { return h === 'ref:' + meta.id; }),
                        opacity: (prefs.opacity || {})['ref:' + meta.id],
                    });
                    if (_legendRefBody) {
                        _legendRefBody.appendChild(_buildLegendItem(slot));
                        if (_legendRefWrap) _legendRefWrap.hidden = false;
                    }
                    _applyRefOrder();
                    if (refFitActive && slot.layer.getBounds().isValid()) {
                        refFitBounds.extend(slot.layer.getBounds());
                        _ownMove = true;
                        map.once('moveend', function() { _ownMove = false; });
                        map.fitBounds(refFitBounds.pad(0.05));
                    }
                });
            }).catch(function(err) { console.warn('Reference layer failed:', err); });
        });
    }

    var colors = ['#4f46e5', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4'];
    var HEAT_DEFAULTS = { radius: 25, blur: 15, minOpacity: 0.4 };

    // ── LayerManager ──────────────────────────────────────────────
    // Slots have two types:
    //   'features' — point/line/polygon features from a question
    //   'heat'     — heatmap derived from a features slot
    function LayerManager() {
        this._map = null;
        this._slots = new Map();
        this._order = [];
        this._sids = null;
        this._paneCounter = 0;
        this._BASE_Z = 400;
        this._STEP = 10;
    }

    LayerManager.prototype._createPane = function() {
        var name = 'geo-pane-' + this._paneCounter++;
        this._map.createPane(name);
        return name;
    };

    // Attribute (sub-answer) popup: content is built with textContent only —
    // values are respondent input and must never be inserted as markup.
    function buildAttributePopupContent(props) {
        var root = document.createElement('div');
        root.className = 'geo-attr-popup';
        var title = document.createElement('strong');
        title.textContent = props.question;
        root.appendChild(title);
        (props.attributes || []).forEach(function(attr) {
            var row = document.createElement('div');
            var name = document.createElement('span');
            name.className = 'text-muted';
            name.textContent = attr.name + ': ';
            row.appendChild(name);
            if (attr.kind === 'image' && attr.href) {
                // Thumbnail inline; click opens full size. href is
                // server-minted (signed URL) — never respondent text.
                var imgLink = document.createElement('a');
                imgLink.href = attr.href;
                imgLink.target = '_blank';
                imgLink.rel = 'noopener';
                imgLink.title = attr.value;
                var thumb = document.createElement('img');
                thumb.src = attr.href;
                thumb.alt = attr.value;
                thumb.style.cssText = 'max-width:96px;max-height:96px;display:block;margin-top:2px;object-fit:cover;border-radius:6px;border:1px solid #dee2e6;';
                imgLink.appendChild(thumb);
                row.appendChild(imgLink);
            } else if (attr.kind === 'audio' && attr.href) {
                var player = document.createElement('audio');
                player.controls = true;
                player.preload = 'none';
                player.src = attr.href;
                player.title = attr.value;
                player.style.cssText = 'display:block;margin-top:2px;max-width:230px;height:30px;';
                row.appendChild(player);
            } else if (attr.href) {
                // Documents: download link; the filename still goes in as
                // text — never markup.
                var link = document.createElement('a');
                link.href = attr.href;
                link.target = '_blank';
                link.rel = 'noopener';
                link.textContent = attr.value;
                row.appendChild(link);
            } else {
                row.appendChild(document.createTextNode(attr.value));
            }
            root.appendChild(row);
        });
        return root;
    }

    function openAttributePopup(map, feature, latlng) {
        L.popup({ maxWidth: 280 })
            .setLatLng(latlng)
            .setContent(buildAttributePopupContent(feature.properties))
            .openOn(map);
    }

    LayerManager.prototype.init = function(map, geoData, colors) {
        this._map = map;

        var questionNames = [];
        var questionGeomType = {};
        geoData.features.forEach(function(f) {
            var qName = f.properties.question;
            if (!questionGeomType[qName]) {
                questionNames.push(qName);
                questionGeomType[qName] = f.geometry.type;
            }
        });

        questionNames.forEach(function(qName, idx) {
            var geomType = questionGeomType[qName];
            var color = colors[idx % colors.length];
            var paneName = this._createPane();

            var slot = {
                id: qName,
                type: 'features',
                geomType: geomType,
                color: color,
                pane: paneName,
                visible: true,
                features: [],
                allPoints: [],
            };

            geoData.features.forEach(function(f) {
                if (f.properties.question !== qName) return;
                var sid = f.properties.session_id;
                var featureLayer;

                if (f.geometry.type === 'Point') {
                    var coords = f.geometry.coordinates;
                    featureLayer = L.circleMarker(L.latLng(coords[1], coords[0]), {
                        radius: 5, color: color, fillColor: color,
                        fillOpacity: 0.7, weight: 1, pane: paneName,
                    });
                    featureLayer.feature = f;
                    slot.allPoints.push([coords[1], coords[0]]);
                } else {
                    featureLayer = L.geoJSON(f, {
                        style: function() { return { color: color, weight: 2, fillOpacity: 0.2 }; },
                        pane: paneName,
                    });
                }

                featureLayer.on('click', function(e) {
                    var mode = window.geoToolMode || 'pointer';
                    if (mode === 'pointer') {
                        if (window.selectionManager) {
                            if (e.originalEvent && e.originalEvent.ctrlKey) {
                                window.selectionManager.toggle(sid);
                            } else {
                                window.selectionManager.setSelection([sid]);
                            }
                        }
                        openAttributePopup(map, f, e.latlng);
                    } else if (mode === 'details') {
                        openSessionDetailModal(sid);
                    }
                });

                featureLayer.addTo(map);
                slot.features.push({ layer: featureLayer, sid: sid });
            });

            this._slots.set(qName, slot);
            this._order.push(qName);
        }.bind(this));

        this._assignPaneZIndices();
    };

    LayerManager.prototype._assignPaneZIndices = function() {
        var BASE = this._BASE_Z, STEP = this._STEP;
        var last = this._order.length - 1;
        this._order.forEach(function(id, idx) {
            var slot = this._slots.get(id);
            this._map.getPane(slot.pane).style.zIndex = BASE + (last - idx) * STEP;
        }.bind(this));
    };

    // ── Heat layer lifecycle ──────────────────────────────────────

    // leaflet.heat draws by reading the canvas back with getImageData, which
    // throws IndexSizeError the moment that canvas is 0 wide. Leaflet sizes it
    // from map.getSize(), so any redraw while the map pane is hidden hits it --
    // and invalidateSize(), called from sixteen places across the analytics
    // templates, fires exactly that redraw chain. Guarding the layer covers
    // every one of those callers; guarding the callers would not cover the
    // seventeenth. A pane nobody can see has nothing worth drawing.
    // The respondent template guards flyTo the same way, for the same reason.
    function _guardHeatRedraw(layer) {
        var original = layer._redraw;
        if (typeof original !== 'function') return layer;
        layer._redraw = function() {
            var c = this._canvas;
            if (!c || !c.width || !c.height) return;
            return original.apply(this, arguments);
        };
        return layer;
    }

    LayerManager.prototype.createHeat = function(sourceId) {
        var src = this._slots.get(sourceId);
        if (!src || src.geomType !== 'Point' || !src.allPoints.length) return null;

        var heatId = 'heat:' + sourceId;
        if (this._slots.has(heatId)) return null; // already exists

        var paneName = this._createPane();
        var heatLayer = L.heatLayer([], Object.assign({}, HEAT_DEFAULTS));
        _guardHeatRedraw(heatLayer);
        heatLayer.addTo(this._map);

        // Move canvas into dedicated pane for z-ordering
        var canvas = heatLayer._canvas;
        if (canvas) this._map.getPane(paneName).appendChild(canvas);

        var slot = {
            id: heatId,
            type: 'heat',
            sourceId: sourceId,
            label: null,
            color: src.color,
            pane: paneName,
            visible: true,
            heatLayer: heatLayer,
        };

        this._slots.set(heatId, slot);
        // Insert right above source in order
        var srcIdx = this._order.indexOf(sourceId);
        this._order.splice(srcIdx + 1, 0, heatId);
        this._assignPaneZIndices();

        // Initial render with current filter
        this._rebuildHeat(slot);
        return heatId;
    };

    LayerManager.prototype.removeHeat = function(heatId) {
        var slot = this._slots.get(heatId);
        if (!slot || slot.type !== 'heat') return;

        // Hide canvas and remove from DOM
        var canvas = slot.heatLayer._canvas;
        if (canvas && canvas.parentNode) canvas.parentNode.removeChild(canvas);

        this._slots.delete(heatId);
        var idx = this._order.indexOf(heatId);
        if (idx !== -1) this._order.splice(idx, 1);
        this._assignPaneZIndices();
    };

    LayerManager.prototype._rebuildHeat = function(slot) {
        if (!slot.heatLayer || !slot.heatLayer._canvas) return;
        var canvas = slot.heatLayer._canvas;
        var src = this._slots.get(slot.sourceId);

        if (!slot.visible || !src) {
            canvas.style.display = 'none';
            return;
        }

        var points;
        if (this._sids === null) {
            points = src.allPoints;
        } else {
            var sids = this._sids;
            points = [];
            src.features.forEach(function(entry) {
                if (!sids.has(entry.sid)) return;
                if (typeof entry.layer.getLatLng === 'function') {
                    var ll = entry.layer.getLatLng();
                    points.push([ll.lat, ll.lng]);
                }
            });
        }

        if (points.length === 0) {
            canvas.style.display = 'none';
            return;
        }

        canvas.style.display = '';
        slot.heatLayer.setLatLngs(points);
    };

    LayerManager.prototype.setHeatOptions = function(heatId, opts) {
        var slot = this._slots.get(heatId);
        if (!slot || !slot.heatLayer) return;
        slot.heatLayer.setOptions(opts);
        slot.heatLayer.redraw();
    };

    // ── Reference layer slots ─────────────────────────────────────
    // A creator-uploaded overlay from the Survey settings. Appended at the
    // bottom of the order so it starts beneath every answer layer; the panel
    // can drag it anywhere afterwards.
    LayerManager.prototype.addReference = function(entry, opts) {
        opts = opts || {};
        var id = 'ref:' + entry.meta.id;
        if (this._slots.has(id)) return this._slots.get(id);
        var paneName = this._createPane();
        var layer = window.RefLayerFactory.build(entry.meta, entry.fc, { interactive: false, pane: paneName });
        var slot = {
            id: id, type: 'reference', meta: entry.meta, layer: layer, pane: paneName,
            visible: opts.visible !== false,
            opacity: typeof opts.opacity === 'number' ? opts.opacity : 1,
        };
        entry.layer = layer;
        entry.slot = slot;
        this._slots.set(id, slot);
        this._order.push(id);
        if (slot.visible) layer.addTo(this._map);
        this._map.getPane(paneName).style.opacity = slot.opacity;
        this._assignPaneZIndices();
        return slot;
    };

    // Opacity is the pane's CSS opacity, not a per-feature setStyle: simplestyle
    // files carry their own fill/stroke opacities, and one property on the pane
    // dims the whole layer uniformly while keeping the file's relative styling.
    // Labels sit in the tooltip pane and stay readable -- that is what a label is for.
    LayerManager.prototype.setReferenceOpacity = function(id, value) {
        var slot = this._slots.get(id);
        if (!slot || slot.type !== 'reference') return;
        slot.opacity = Math.max(0, Math.min(1, value));
        this._map.getPane(slot.pane).style.opacity = slot.opacity;
    };

    // ── Visibility & filtering ────────────────────────────────────

    LayerManager.prototype.setFilter = function(sids) {
        if (!this._slots || this._slots.size === 0) return;
        this._sids = sids;

        this._slots.forEach(function(slot) {
            if (slot.type === 'features') {
                slot.features.forEach(function(entry) {
                    var sidOk = sids === null || sids.has(entry.sid);
                    var visible = slot.visible && sidOk;
                    if (visible) {
                        if (!this._map.hasLayer(entry.layer)) entry.layer.addTo(this._map);
                    } else {
                        if (this._map.hasLayer(entry.layer)) this._map.removeLayer(entry.layer);
                    }
                }.bind(this));
            } else if (slot.type === 'heat' && slot.visible) {
                this._rebuildHeat(slot);
            }
        }.bind(this));
    };

    LayerManager.prototype.setLayerVisible = function(id, visible) {
        var slot = this._slots.get(id);
        if (!slot) return;
        slot.visible = visible;

        if (slot.type === 'features') {
            slot.features.forEach(function(entry) {
                if (visible) {
                    var sidOk = this._sids === null || this._sids.has(entry.sid);
                    if (sidOk && !this._map.hasLayer(entry.layer)) entry.layer.addTo(this._map);
                } else {
                    if (this._map.hasLayer(entry.layer)) this._map.removeLayer(entry.layer);
                }
            }.bind(this));
        } else if (slot.type === 'heat') {
            this._rebuildHeat(slot);
        } else if (slot.type === 'reference') {
            if (visible) {
                if (!this._map.hasLayer(slot.layer)) slot.layer.addTo(this._map);
            } else if (this._map.hasLayer(slot.layer)) {
                this._map.removeLayer(slot.layer);
            }
        }
    };

    LayerManager.prototype.reorder = function(newOrder) {
        if (!newOrder || !newOrder.length) return;
        this._order = newOrder;
        this._assignPaneZIndices();
    };

    LayerManager.prototype.getFeatureLayers = function() {
        var result = [];
        this._slots.forEach(function(slot) {
            if (slot.type !== 'features') return;
            slot.features.forEach(function(entry) {
                result.push({ layer: entry.layer, sid: entry.sid, question: slot.id, color: slot.color });
            });
        });
        return result;
    };

    LayerManager.prototype.getSlotIds = function() { return this._order.slice(); };
    LayerManager.prototype.getSlot = function(id) { return this._slots.get(id); };

    LayerManager.prototype.hasHeatFor = function(sourceId) {
        return this._slots.has('heat:' + sourceId);
    };

    // ── Instantiate ───────────────────────────────────────────────
    window.layerManager = new LayerManager();
    window.layerManager.init(map, geoData, colors);

    // ── Draw handlers ─────────────────────────────────────────────
    var drawShapeOpts = { color: '#4f46e5', weight: 2, fillOpacity: 0.08, dashArray: '4,4' };
    var rectHandler = new L.Draw.Rectangle(map, { shapeOptions: drawShapeOpts });
    var polyHandler = new L.Draw.Polygon(map, { shapeOptions: drawShapeOpts });

    var _ctrlHeld = false;
    document.addEventListener('keydown', function(e) { if (e.key === 'Control') _ctrlHeld = true; });
    document.addEventListener('keyup', function(e) { if (e.key === 'Control') _ctrlHeld = false; });


    map.on('draw:created', function(e) {
        var allFeatures = window.layerManager.getFeatureLayers();
        var matchingSids = new Set();
        allFeatures.forEach(function(entry) {
            if (!map.hasLayer(entry.layer)) return;
            if (e.layerType === 'rectangle') {
                var bounds = e.layer.getBounds();
                if (typeof entry.layer.getLatLng === 'function') {
                    if (bounds.contains(entry.layer.getLatLng())) matchingSids.add(entry.sid);
                } else if (typeof entry.layer.getBounds === 'function') {
                    if (bounds.intersects(entry.layer.getBounds())) matchingSids.add(entry.sid);
                }
            } else if (e.layerType === 'polygon') {
                if (typeof entry.layer.getLatLng === 'function') {
                    if (_pointInPolygon(entry.layer.getLatLng(), e.layer)) matchingSids.add(entry.sid);
                } else if (typeof entry.layer.getBounds === 'function') {
                    if (e.layer.getBounds().intersects(entry.layer.getBounds())) matchingSids.add(entry.sid);
                }
            }
        });
        if (window.selectionManager) {
            if (_ctrlHeld && matchingSids.size > 0) {
                window.selectionManager.select(Array.from(matchingSids));
            } else if (matchingSids.size > 0) {
                window.selectionManager.setSelection(Array.from(matchingSids));
            } else {
                window.selectionManager.clear();
            }
        }
        window.setGeoTool('pointer');
    });

    function _pointInPolygon(latlng, polygonLayer) {
        var polyPoints = polygonLayer.getLatLngs()[0];
        var x = latlng.lat, y = latlng.lng;
        var inside = false;
        for (var i = 0, j = polyPoints.length - 1; i < polyPoints.length; j = i++) {
            var xi = polyPoints[i].lat, yi = polyPoints[i].lng;
            var xj = polyPoints[j].lat, yj = polyPoints[j].lng;
            if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
        }
        return inside;
    }

    var allBounds = L.geoJSON(geoData).getBounds();
    if (allBounds.isValid()) {
        map.fitBounds(allBounds.pad(0.02));
    } else {
        // No answers yet: a placeholder view until the first reference layer
        // arrives and the loader above fits the map to it.
        map.setView([20, 0], 2);

    // ── Legend control ─────────────────────────────────────────────
    var _legendBody = null;

    function _buildLegendItem(slot) {
        var id = slot.id;
        var item = document.createElement('div');
        item.className = 'geo-legend-item' + (slot.type === 'reference' ? ' geo-legend-item-ref' : '');
        item.dataset.layerId = id;

        var row = document.createElement('div');
        row.className = 'geo-legend-row';

        // Drag handle
        var handle = document.createElement('i');
        handle.className = 'fas fa-grip-vertical geo-drag-handle';
        row.appendChild(handle);

        // Visibility checkbox
        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = slot.visible;
        cb.addEventListener('change', function() {
            window.layerManager.setLayerVisible(id, cb.checked);
            if (window.filterManager) window.filterManager._renderSelection();
            if (slot.type === 'reference' && window._saveRefPrefs) window._saveRefPrefs();
        });
        row.appendChild(cb);

        if (slot.type === 'features') {
            // Geometry type icon (colored)
            var geomIcons = { 'Point': 'fa-circle', 'LineString': 'fa-route', 'Polygon': 'fa-draw-polygon' };
            var geomIcon = document.createElement('i');
            geomIcon.className = 'fas ' + (geomIcons[slot.geomType] || 'fa-circle');
            geomIcon.className += ' geo-legend-geom-icon';
            geomIcon.style.color = slot.color;
            row.appendChild(geomIcon);

            // Label
            var label = document.createElement('span');
            label.className = 'geo-legend-label';
            label.textContent = id;
            label.title = 'Zoom to layer';
            label.addEventListener('click', function() {
                var bounds = L.latLngBounds([]);
                slot.features.forEach(function(entry) {
                    if (typeof entry.layer.getLatLng === 'function') bounds.extend(entry.layer.getLatLng());
                    else if (typeof entry.layer.getBounds === 'function') bounds.extend(entry.layer.getBounds());
                });
                if (bounds.isValid()) map.fitBounds(bounds.pad(0.02));
            });
            row.appendChild(label);

            // Zoom icon
            var aimIcon = document.createElement('i');
            aimIcon.className = 'fas fa-crosshairs';
            aimIcon.style.cssText = 'color:#9ca3af;font-size:0.7rem;flex-shrink:0;cursor:pointer;';
            aimIcon.title = 'Zoom to layer';
            aimIcon.addEventListener('click', function() { label.click(); });
            row.appendChild(aimIcon);

            // Menu button (for Point layers only)
            if (slot.geomType === 'Point' && slot.allPoints.length > 0) {
                var menuBtn = document.createElement('button');
                menuBtn.className = 'geo-layer-menu-btn';
                menuBtn.title = 'Layer actions';
                var menuIcon = document.createElement('i');
                menuIcon.className = 'fas fa-ellipsis-v';
                menuBtn.appendChild(menuIcon);
                menuBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    _showLayerMenu(id, menuBtn);
                });
                row.appendChild(menuBtn);
            }
        } else if (slot.type === 'heat') {
            // Gradient swatch
            var hSwatch = document.createElement('span');
            hSwatch.className = 'geo-legend-heat-swatch';
            row.appendChild(hSwatch);

            // Label
            var hLabel = document.createElement('span');
            hLabel.className = 'geo-legend-label geo-legend-heat-label';
            hLabel.textContent = slot.label || slot.sourceId;
            hLabel.title = 'Double-click to rename';
            hLabel.addEventListener('dblclick', function(e) {
                e.stopPropagation();
                var input = document.createElement('input');
                input.type = 'text';
                input.className = 'geo-legend-rename';
                input.value = hLabel.textContent;
                hLabel.replaceWith(input);
                input.focus();
                input.select();
                function commit() {
                    var val = input.value.trim() || slot.sourceId;
                    slot.label = val;
                    hLabel.textContent = val;
                    input.replaceWith(hLabel);
                }
                input.addEventListener('blur', commit);
                input.addEventListener('keydown', function(ke) {
                    if (ke.key === 'Enter') input.blur();
                    if (ke.key === 'Escape') { input.value = hLabel.textContent; input.blur(); }
                });
            });
            row.appendChild(hLabel);

            // Settings
            var gearBtn = document.createElement('button');
            gearBtn.className = 'geo-heat-settings-btn';
            gearBtn.title = 'Heatmap settings';
            var gearIcon = document.createElement('i');
            gearIcon.className = 'fas fa-sliders-h';
            gearBtn.appendChild(gearIcon);
            gearBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                _openHeatSettings(id);
            });
            row.appendChild(gearBtn);

            // Delete
            var delBtn = document.createElement('button');
            delBtn.className = 'geo-heat-settings-btn';
            delBtn.title = 'Remove heatmap';
            var delIcon = document.createElement('i');
            delIcon.className = 'fas fa-times';
            delBtn.appendChild(delIcon);
            delBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                _closeHeatSettings();
                window.layerManager.removeHeat(id);
                item.remove();
            });
            row.appendChild(delBtn);
        } else if (slot.type === 'reference') {
            var rSwatch = document.createElement('span');
            rSwatch.className = 'geo-legend-ref-swatch';
            rSwatch.style.background = slot.meta.color;
            row.appendChild(rSwatch);

            var rLabel = document.createElement('span');
            rLabel.className = 'geo-legend-label';
            rLabel.textContent = slot.meta.name;
            rLabel.title = slot.meta.name + ' \u2014 zoom to layer';
            rLabel.addEventListener('click', function() {
                var b = slot.layer.getBounds();
                if (b.isValid()) map.fitBounds(b.pad(0.05));
            });
            row.appendChild(rLabel);
            // Layer style: the same legend rows respondents see (spec layer-style).
            if (slot.meta.legend && slot.meta.legend.length && window.RefLayerFactory) {
                var pill = document.createElement('span');
                pill.className = 'geo-legend-pill';
                pill.textContent = 'by ' + (slot.meta.style && slot.meta.style.by ? slot.meta.style.by.field : 'attribute');
                row.appendChild(pill);
                var legend = document.createElement('div');
                legend.className = 'geo-legend-ref-rows';
                legend.innerHTML = window.RefLayerFactory.legendHtml(slot.meta);
                row.appendChild(legend);
            }

            var rAim = document.createElement('i');
            rAim.className = 'fas fa-crosshairs';
            rAim.style.cssText = 'color:#9ca3af;font-size:0.7rem;flex-shrink:0;cursor:pointer;';
            rAim.title = 'Zoom to layer';
            rAim.addEventListener('click', function() { rLabel.click(); });
            row.appendChild(rAim);

            var opBtn = document.createElement('button');
            opBtn.className = 'geo-heat-settings-btn';
            opBtn.title = 'Opacity';
            var opIcon = document.createElement('i');
            opIcon.className = 'fas fa-adjust';
            opBtn.appendChild(opIcon);
            opBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                _openReferenceSettings(id);
            });
            row.appendChild(opBtn);
        }

        item.appendChild(row);
        return item;
    }

    function _showLayerMenu(sourceId, anchorEl) {
        _closeLayerMenu();
        var menu = document.createElement('div');
        menu.className = 'geo-layer-menu';
        L.DomEvent.disableClickPropagation(menu);

        var hasHeat = window.layerManager.hasHeatFor(sourceId);

        heatIcon.className = 'fas fa-fire';

        heatAction.appendChild(document.createTextNode(hasHeat ? ' Heatmap exists' : ' Create Heatmap'));

            heatAction.addEventListener('click', function() {
                var heatId = window.layerManager.createHeat(sourceId);
                if (heatId && _legendBody) {
                    var heatSlot = window.layerManager.getSlot(heatId);
                    var heatItem = _buildLegendItem(heatSlot);
                    // Insert after source item in DOM
                    var sourceItem = _legendBody.querySelector('[data-layer-id="' + CSS.escape(sourceId) + '"]');

        document.body.appendChild(menu);
        var rect = anchorEl.getBoundingClientRect();
        menu.style.left = Math.min(rect.left, window.innerWidth - menu.offsetWidth - 8) + 'px';

        setTimeout(function() { document.addEventListener('mousedown', _onDocClickCloseMenu); }, 0);

            refWrap.appendChild(refTitle);
            var refBody = document.createElement('div');
            refBody.className = 'geo-legend-group-body';
            refWrap.appendChild(refBody);
            _legendRefBody = refBody;
            _legendRefWrap = refWrap;
            div.appendChild(refWrap);

            toggleAll.addEventListener('change', function() {
                var checked = toggleAll.checked;
                div.querySelectorAll('.geo-legend-item input[type=checkbox]').forEach(function(cb) {
                    if (cb.checked !== checked) {
                        cb.checked = checked;
                        cb.dispatchEvent(new Event('change'));
                    }
                });
            });

            toggle.addEventListener('click', function() {
                body.classList.toggle('collapsed');
                refWrap.classList.toggle('collapsed');
            });

            if (typeof Sortable !== 'undefined') {
                var sortOpts = {
                    animation: 150,
                    handle: '.geo-drag-handle',
                    draggable: '.geo-legend-item',
                    ghostClass: 'sortable-ghost',
                    onEnd: _syncOrderFromPanel,
                };
                Sortable.create(body, sortOpts);
                Sortable.create(refBody, sortOpts);
            }

            return div;
        }
    });
    new LegendControl({ position: 'topleft' }).addTo(map);
});
</script>
