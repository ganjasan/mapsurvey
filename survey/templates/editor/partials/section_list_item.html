{% load i18n %}
<li class="section-item{% if is_current %} active{% endif %}"
    data-section-id="{{ section.id }}"
    data-section-name="{{ section.name }}">
    <span class="drag-handle"><i class="fas fa-grip-vertical"></i></span>
    <span class="section-title">{{ section.title|default:section.name }}</span>
    {% load question_utils %}{% with vis=section|visibility_info:survey %}{% if vis %}
    {% if vis.broken %}
    <span class="badge badge-warning" title="{{ vis.reason }}. Shown to everyone until fixed."><i class="fas fa-exclamation-triangle"></i></span>
    {% else %}
    <span class="badge" title="{{ vis.label }}" style="background:#e7f1ff;color:#0b5ed7;border:1px solid #b6d4fe;"><i class="fas fa-code-branch"></i></span>
    {% endif %}
    {% endif %}{% endwith %}
    {% if section.question_count is not None %}<span class="section-qcount" title="{% trans 'Questions in this section' %}">{{ section.question_count }}</span>{% endif %}
    <button class="section-action" title="{% trans 'Duplicate' %}"
            hx-post="{% url 'editor_section_duplicate' survey.uuid section.id %}"
            hx-target="closest .section-item"
            hx-swap="afterend"
            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
        <i class="fas fa-copy"></i>
    </button>
    <button class="section-action copy-section-btn" title="{% trans 'Copy' %}"
            data-survey-uuid="{{ survey.uuid }}"
            data-section-id="{{ section.id }}"
            data-section-title="{{ section.title|default:section.name }}">
        <i class="fas fa-clipboard"></i>
    </button>
    <button class="section-delete"
            hx-post="{% url 'editor_section_delete' survey.uuid section.id %}"
            hx-target="closest .section-item"
            hx-swap="outerHTML"
            hx-confirm="Delete section '{{ section.title|default:section.name }}'?"
            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
        <i class="fas fa-times"></i>
    </button>
</li>
