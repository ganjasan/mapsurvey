    .analytics-main.focus-mode > .stat-cards,
    .analytics-main.focus-mode > .analytics-divider,
    .analytics-main.focus-mode > #filter-pills-bar {

    }
    .analytics-main.focus-mode > .analytics-section.is-focused {
        grid-column: 1;
        grid-row: span 20;
    }
    .analytics-main.focus-mode > .analytics-section.is-focused #analytics-map {
