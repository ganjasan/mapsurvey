{% comment %}
Canned respondent-side example per input type, for the picker's hover flyout.
Deliberately generic (a fruit survey), distinct from the live "Respondent
sees" pane which shows the question actually being configured. Hidden divs
rather than <template> elements: htmx swaps arrive wrapped in a template, and
nesting templates inside that breaks fragment parsing (script tags after them
never ran).
{% endcomment %}
<div hidden data-qtp-example="text">
    <div class="qtp-ex-title">Tell us about your favourite fruit</div>
    <textarea class="form-control" rows="3" placeholder="Type your answer…"></textarea>
</div>
<div hidden data-qtp-example="text_line">
    <div class="qtp-ex-title">Your favourite fruit</div>
    <input class="form-control" placeholder="Type your answer…">
</div>
<div hidden data-qtp-example="number">
    <div class="qtp-ex-title">How many apples per week?</div>
    <input type="number" class="form-control" value="4" style="max-width:120px;">
</div>
<div hidden data-qtp-example="choice">
    <div class="qtp-ex-title">Pick your favourite fruit</div>
    <div><label><input type="radio" checked> Apples</label></div>
    <div><label><input type="radio"> Bananas</label></div>
    <div><label><input type="radio"> Cherries</label></div>
</div>
<div hidden data-qtp-example="multichoice">
    <div class="qtp-ex-title">Which fruits do you eat?</div>
    <div><label><input type="checkbox" checked> Apples</label></div>
    <div><label><input type="checkbox" checked> Bananas</label></div>
    <div><label><input type="checkbox"> Cherries</label></div>
</div>
<div hidden data-qtp-example="range">
    <div class="qtp-ex-title">How ripe do you like bananas?</div>
    <input type="range" min="1" max="10" value="6" style="width:100%;">
    <div class="qtp-ex-ends"><span>1 · green</span><span>10 · brown</span></div>
</div>
<div hidden data-qtp-example="rating">
    <div class="qtp-ex-title">How much do you like apples?</div>
    <div class="qtp-ex-rating">
        <span class="qtp-ex-opt">1<br><small>worst</small><input type="radio"></span>
        <span class="qtp-ex-opt">2<br>&nbsp;<input type="radio"></span>
        <span class="qtp-ex-opt">3<br>&nbsp;<input type="radio"></span>
        <span class="qtp-ex-opt">4<br>&nbsp;<input type="radio" checked></span>
        <span class="qtp-ex-opt">5<br><small>best</small><input type="radio"></span>
    </div>
</div>
<div hidden data-qtp-example="datetime">
    <div class="qtp-ex-title">When did you last buy fruit?</div>
    <input type="datetime-local" class="form-control" style="max-width:220px;">
</div>
<div hidden data-qtp-example="point">
    <div class="qtp-ex-title">Where is your fruit market?</div>
    <div class="qtp-ex-map">
        <i class="fas fa-map-marker-alt qtp-ex-pin"></i>
        <span class="qtp-ex-drawbtn"><i class="fas fa-map-marker-alt"></i> Place point</span>
    </div>
</div>
<div hidden data-qtp-example="line">
    <div class="qtp-ex-title">Your route to the market</div>
    <div class="qtp-ex-map">
        <svg viewBox="0 0 300 110" preserveAspectRatio="none">
            <polyline points="20,90 90,70 150,80 210,35 280,25" fill="none"
                stroke="#0d6efd" stroke-width="3" stroke-dasharray="7 4" stroke-linecap="round"/>
        </svg>
        <span class="qtp-ex-drawbtn"><i class="fas fa-route"></i> Draw line</span>
    </div>
</div>
<div hidden data-qtp-example="polygon">
    <div class="qtp-ex-title">Outline the orchard</div>
    <div class="qtp-ex-map">
        <svg viewBox="0 0 300 110" preserveAspectRatio="none">
            <polygon points="60,25 220,20 260,75 160,95 55,80" fill="rgba(13,110,253,.25)"
                stroke="#0d6efd" stroke-width="2"/>
        </svg>
        <span class="qtp-ex-drawbtn"><i class="fas fa-draw-polygon"></i> Draw area</span>
    </div>
</div>
<div hidden data-qtp-example="image">
    <div class="qtp-ex-title">(shown to respondent)</div>
    <div class="qtp-ex-imgph"><i class="fas fa-image"></i></div>
</div>
<div hidden data-qtp-example="html">
    <div class="qtp-ex-title">(shown to respondent, as formatted)</div>
    <div style="font-size:12px;"><b>Welcome!</b>
        <p style="margin:0;">This survey takes <i>5 minutes</i>. Your answers are anonymous.</p>
    </div>
</div>
